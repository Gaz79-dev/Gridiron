<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridiron - Player Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/ui.css">
</head>
<body class="bg-gray-900 text-gray-300 font-sans">

    <header class="gx-shell-header">
        <nav class="gx-shell-nav">
            <a href="/" class="gx-brand">
                <img src="/static/logo.jpg" alt="Gridiron Logo">
                <span>
                    <span class="gx-brand-title">Gridiron</span>
                    <span class="gx-brand-subtitle">Event Command</span>
                </span>
            </a>
            <div class="gx-nav-links">
                <a href="/">Squad Builder</a>
                <a href="/events">Events</a>
                <a href="/engagement">Engagement</a>
                <a href="/archive">Archive</a>
                <a href="/players">Players</a>
                <a href="/stats">Stats</a>
                <a href="/admin" id="admin-link">Admin</a>
                <button id="logout-btn" type="button">Logout</button>
            </div>
        </nav>
    </header>

    <section class="gx-page-hero">
        <div class="gx-page-eyebrow">Gridiron</div>
        <h1 class="gx-page-title">Player Detail</h1>
        <p class="gx-page-copy">Review individual engagement history.</p>
    </section>

    <main class="container mx-auto px-6 py-8">
        <section class="bg-gray-800 p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-white mb-4">Accepted Event History</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr class="border-b border-gray-700">
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Event Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Start Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">End Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">RSVP</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Class</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body">
                        <tr><td colspan="6" class="text-center p-8">Loading event history...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/player_detail.js"></script>
    <script src="/static/ui.js"></script>
</body>
</html>
