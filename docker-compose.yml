services:
  bot:
    build: .
    container_name: gridiron-bot
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m bot.bot
    networks:
      - gridiron-net

  web:
    build: .
    container_name: gridiron-web
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8015:8000"
    command: uvicorn bot.main:app --host 0.0.0.0 --port 8000
    networks:
      - gridiron-net

  db:
    image: postgres:14
    container_name: gridiron-db
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gridiron-net

networks:
  gridiron-net:
    driver: bridge
